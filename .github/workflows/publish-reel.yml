name: Publish one Reel

# Hourly. queue.js publishes at most ONE due item per run and records the result
# back into queue.json, which this workflow commits. That commit is the lock
# that stops the same Reel going out twice.
on:
  schedule:
  # Narrowed 2026-09-09. Running every 15 min around the clock was 8,670 runs a
  # month across the three repos - past the Actions quota on private repos, and
  # when that runs out GitHub silently stops scheduled workflows. One post a day
  # only needs a window: 8 attempts over two hours still absorbs dropped ticks,
  # and a missed day is picked up by the next window because the item stays due.
  # Narrowed again 2026-09-10 after the quota ran out. GitHub bills a FULL MINUTE
  # per job however short it is, so every extra tick in the window costs the same
  # as a real post. Eight ticks a day x 3 repos was ~750 min/month for 3 posts.
  # Two ticks is enough: the first absorbs a dropped or delayed cron, the second
  # is the retry, and a genuinely missed day stays due so the next window sends
  # it. Do NOT widen this back out, and do not re-add workflow_dispatch.
    - cron: '6,36 17 * * *'   # posts 17:00Z

permissions:
  contents: write

concurrency:
  group: publish-reel
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Verify credentials still work
        shell: bash
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          AUTH_MODE: ${{ secrets.AUTH_MODE }}
          GRAPH_VERSION: ${{ secrets.GRAPH_VERSION }}
        run: node check.js

      - name: Publish the one due Reel
        shell: bash
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          AUTH_MODE: ${{ secrets.AUTH_MODE }}
          GRAPH_VERSION: ${{ secrets.GRAPH_VERSION }}
        run: |
          set -o pipefail
          node queue.js --confirm | tee run.log

      # Read-only: publishes nothing. Writes stats.json + stats_history.jsonl so
      # the numbers are readable off this machine (raw.githubusercontent.com is
      # reachable where graph.instagram.com is not). --max-age 50 throttles it to
      # roughly one collection per posting window.
      - name: Collect analytics
        continue-on-error: true          # analytics must never block publishing
        shell: bash
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          AUTH_MODE: ${{ secrets.AUTH_MODE }}
          GRAPH_VERSION: ${{ secrets.GRAPH_VERSION }}
        run: node analytics.js --limit 30 --max-age 50

      - name: Commit queue.json and stats
        run: |
          for f in queue.json stats.json stats_history.jsonl; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "Nothing due and no new stats - nothing to commit."
            exit 0
          fi
          git config user.name  "lost-empires-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "publish/stats: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

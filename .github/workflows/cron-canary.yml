name: cron canary
# Throwaway diagnostic: proves whether GitHub dispatches schedule events for this
# repo at all. Does nothing but print the time. Delete once cron is confirmed.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: date -u '+canary fired at %H:%M UTC'
